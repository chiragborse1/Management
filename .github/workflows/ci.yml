name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --check "client/src/**/*.{ts,tsx,css,json}" "server/src/**/*.{ts,json}" "shared/src/**/*.{ts,json}" "*.{json,md,yaml,yml}"

  lint-typecheck-build:
    name: Lint, Typecheck & Build (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [client, server, shared]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint --workspace=${{ matrix.workspace }}
      - name: Typecheck
        run: npm run typecheck --workspace=${{ matrix.workspace }}
      - name: Build
        run: npm run build --workspace=${{ matrix.workspace }}
